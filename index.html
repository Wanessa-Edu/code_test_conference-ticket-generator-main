<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- vai garantir a exibição correta do site com base no dispositivo do usuário -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets\images\favicon-32x32.png">
  <link rel="stylesheet" href="stylesheet.css">
  <title>Conference Ticket Generator</title>
</head>
<body>
<main class="page-shell">
  <!-- Form -->
  <img class="brand" src="assets\images\logo-full.svg" alt="Coding Conf Logo">
  <section class="intro" aria-labelledby="Coding Conf 2025"> <!-- titulo da página no navegador -->
  <div class="form-header">
    <h1 id="page-title">Your Journey to Coding Conf 2025 Starts Here!</h1>
    <p>Secure your spot at next year's biggest coding conference.</p>
  </div>
</section>

<!-- o form pede a foto -->
  <form class="ticket-form" id="ticketForm" action="./confirmation.html" method="get" novalidate>
    <div class="field">
      <label for="avatar">Upload Avatar</label>
      <label class="upload-box" id="uploadBox" for="avatar">
        <span class="avatar-preview" id="avatarPreview">
          <img src="./assets/images/icon-upload.svg" alt="" aria-hidden="true">
        </span>
        <span id="uploadText">Drag and drop or click to upload</span>
        </label>
        <input class="sr-only" type="file" id="avatar" accept="image/png, image/jpeg">
        <p class="hint" id="avatarHint">
          <img src="./assets/images/icon-info.svg" alt="" aria-hidden="true">
        Upload your photo (JPG or PNG, max size: 500KB).
      </p>
    </div>

    <!-- o form pede o nome completo -->
    <div class="field">
      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="full-name" autocomplete="name" required>
      <p class="error" id="nameError"></p>
    </div>

    <!-- o form pede o email -->
    <div class="field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="example@email.com" autocomplete="email" required>
      <p class="error" id="emailError"></p>
    </div>

    <!-- o form pede o username do github -->
    <div class="field">
      <label for="github">GitHub Username</label>
      <input type="text" id="github" name="github" placeholder="@yourusername" autocomplete="username" required>
      <p class="error" id="githubError"></p>
    </div>

    <button type="submit">Generate My Ticket</button>
  </form>

  <!-- Form ends -->

</main>
<script src="./app.js" defer></script>
</body>
</html>
